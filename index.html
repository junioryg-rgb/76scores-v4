<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>76SCORES REAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-[#0a0e14] text-white flex justify-center">
<div class="w-full max-w-[430px] bg-[#12171f] min-h-screen flex flex-col pb-[70px]">

<header class="p-3 bg-[#1a212e] sticky top-0 z-20">
  <h1 class="font-black">76<span class="text-[#ff3b3b]">SCORES</span> <span id="status" class="text-[8px] bg-yellow-500 text-black px-2 py-0.5 rounded-full">CARGANDO...</span></h1>
  <div class="flex gap-1.5 mt-2 overflow-x-auto">
    <button onclick="setSport('soccer')" id="s-soccer" class="px-3 py-1.5 rounded-full text-[10px] font-black bg-[#ff3b3b]">⚽ FÚTBOL</button>
    <button onclick="setSport('nba')" id="s-nba" class="px-3 py-1.5 rounded-full text-[10px] font-black bg-[#1e2735] text-gray-400">🏀 NBA</button>
    <button onclick="setSport('mlb')" id="s-mlb" class="px-3 py-1.5 rounded-full text-[10px] font-black bg-[#1e2735] text-gray-400">⚾ MLB</button>
  </div>
</header>

<div class="flex bg-[#1a212e] text-[10px] font-bold">
  <button id="t-partidos" onclick="setTab('p')" class="flex-1 py-3 border-b-2 border-[#ff3b3b] text-white">PARTIDOS HOY</button>
  <button id="t-tabla" onclick="setTab('t')" class="flex-1 py-3 border-b-2 border-transparent text-gray-500">TABLA REAL</button>
</div>

<main class="p-3">
  <select id="liga" onchange="load()" class="w-full bg-[#1e2735] text-[13px] rounded-xl px-3 py-3 border border-gray-700 mb-2">
    <option value="ecu.1" selected>🇪🇨 LigaPro Ecuador</option>
    <option value="eng.1">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</option>
    <option value="esp.1">🇪🇸 LaLiga</option>
    <option value="ita.1">🇮🇹 Serie A</option>
    <option value="ger.1">🇩🇪 Bundesliga</option>
    <option value="uefa.champions">🏆 Champions</option>
    <option value="conmebol.libertadores">🏆 Libertadores</option>
    <option value="arg.1">🇦🇷 Argentina</option>
    <option value="bra.1">🇧🇷 Brasil</option>
    <option value="mex.1">🇲🇽 Liga MX</option>
  </select>
  <div id="info" class="text-[10px] text-gray-400 bg-[#1e2735] p-2 rounded-lg mb-2">Iniciando...</div>
  <input id="q" oninput="filter()" placeholder="Buscar equipo..." class="w-full bg-[#1e2735] text-[12px] rounded-full px-4 py-2.5 mb-3 outline-none"/>
  <div id="list" class="space-y-2"></div>
  <div id="table" class="hidden"></div>
</main>
</div>

<script>
let all=[], sport='soccer', tab='p';
const KEY="5ff0e0b271ee58df90e934cee0ed78c7";

function setSport(s){
 sport=s;
 document.querySelectorAll('[id^=s-]').forEach(b=>b.className='px-3 py-1.5 rounded-full text-[10px] font-black bg-[#1e2735] text-gray-400');
 document.getElementById('s-'+s).className='px-3 py-1.5 rounded-full text-[10px] font-black bg-[#ff3b3b]';
 load();
}
function setTab(t){
 tab=t;
 document.getElementById('t-partidos').className=t==='p'?'flex-1 py-3 border-b-2 border-[#ff3b3b] text-white':'flex-1 py-3 border-b-2 border-transparent text-gray-500';
 document.getElementById('t-tabla').className=t==='t'?'flex-1 py-3 border-b-2 border-[#ff3b3b] text-white':'flex-1 py-3 border-b-2 border-transparent text-gray-500';
 document.getElementById('list').classList.toggle('hidden', t!=='p');
 document.getElementById('table').classList.toggle('hidden', t!=='t');
 document.getElementById('q').classList.toggle('hidden', t!=='p');
 if(t==='t') loadTable(); else load();
}

// FUNCION QUE SI CONECTA - CON PROXY PARA CORS
async function fetchESPN(url){
 try{
  let r=await fetch(url);
  if(!r.ok) throw new Error('direct fail');
  return await r.json();
 }catch(e){
  console.log('Probando con proxy...', e.message);
  // proxy para saltar CORS de StackBlitz
  let proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  let r2=await fetch(proxy);
  let j2=await r2.json();
  return JSON.parse(j2.contents);
 }
}

async function load(){
 const list=document.getElementById('list');
 const info=document.getElementById('info');
 const status=document.getElementById('status');
 list.innerHTML='<div class="py-10 text-center text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i> Cargando ligas reales...</div>';
 status.innerText='CONECTANDO ESPN...';
 status.className='text-[8px] bg-yellow-500 text-black px-2 py-0.5 rounded-full';
 try{
  let liga=document.getElementById('liga').value;
  let url='';
  if(sport==='soccer') url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${liga}/scoreboard`;
  else if(sport==='nba') url=`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard`;
  else if(sport==='mlb') url=`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard`;

  info.innerText=`Pidiendo: ${url}`;
  let data=await fetchESPN(url);
  console.log(data);

  let events=data.events||[];
  if(events.length===0){
    info.innerText=`0 partidos hoy en ${liga}. Mostrando últimos disponibles.`;
    // si hoy no hay, ESPN devuelve vacio, mostramos mensaje con datos igual
  } else {
    info.innerText=`${events.length} partidos encontrados REAL en ${liga} - ${new Date().toLocaleString('es-EC')}`;
  }

  all=events.map(ev=>{
    const comp=ev.competitions[0];
    const home=comp.competitors.find(c=>c.homeAway==='home')||comp.competitors[0];
    const away=comp.competitors.find(c=>c.homeAway==='away')||comp.competitors[1];
    return {
      h: home.team.displayName||home.team.abbreviation,
      a: away.team.displayName||away.team.abbreviation,
      hs: home.score, as: away.score,
      live: comp.status.type.state==='in',
      detail: comp.status.type.shortDetail||comp.status.type.detail,
      logoH: home.team.logo,
      logoA: away.team.logo,
      search: `${home.team.displayName} ${away.team.displayName}`.toLowerCase()
    };
  });

  if(all.length===0){
    list.innerHTML=`<div class="bg-[#1e2735] p-4 rounded-xl text-center text-[11px] text-gray-400">
      No hay partidos HOY en ${liga}.<br>Esto es normal, la temporada 2026/27 inicia en Agosto.<br><br>
      <b>Prueba con:</b><br>• Premier League<br>• Champions<br>• Libertadores<br><br>
      O cambia a NBA/MLB que si tienen partidos ahora.
    </div>`;
    status.innerText='SIN PARTIDOS HOY - ES NORMAL';
    status.className='text-[8px] bg-gray-500 text-white px-2 py-0.5 rounded-full';
  } else {
    render(all);
    status.innerText=`${all.length} PARTIDOS REALES`;
    status.className='text-[8px] bg-green-500 text-white px-2 py-0.5 rounded-full';
  }

 }catch(err){
  list.innerHTML=`<div class="bg-red-500/10 p-3 rounded-xl text-[11px] text-red-400">Error: ${err.message}<br><br>Intenta recargar F5. Si sigue fallando, tu WiFi bloquea ESPN.<br><button onclick="load()" class="mt-2 bg-red-500 text-white px-4 py-1 rounded-full">Reintentar</button></div>`;
  info.innerText=`Error: ${err.message}`;
  status.innerText='ERROR CONEXION';
 }
}

function render(arr){
 const c=document.getElementById('list');
 c.innerHTML=arr.map(i=>`
  <div class="bg-[#1e2735] p-3 rounded-xl border ${i.live?'border-green-500/40':'border-gray-700/20'} flex items-center justify-between">
   <div class="flex items-center gap-2 flex-1">
     <img src="${i.logoH}" class="w-7 h-7 bg-white rounded-full p-0.5" onerror="this.src='https://via.placeholder.com/28'"/>
     <span class="text-[11px] font-bold truncate">${i.h}</span>
     <b class="ml-auto">${i.hs??0}</b>
   </div>
   <div class="mx-2 text-[8px] px-2 py-1 rounded-full ${i.live?'bg-red-500 text-white animate-pulse':'bg-[#0f141e] text-gray-400'}">${i.live?'LIVE':i.detail}</div>
   <div class="flex items-center gap-2 flex-1 justify-end">
     <b>${i.as??0}</b>
     <span class="text-[11px] font-bold truncate text-right">${i.a}</span>
     <img src="${i.logoA}" class="w-7 h-7 bg-white rounded-full p-0.5" onerror="this.src='https://via.placeholder.com/28'"/>
   </div>
  </div>
 `).join('');
}

async function loadTable(){
 const c=document.getElementById('table');
 c.innerHTML='<div class="py-8 text-center text-gray-400 text-[11px]">Cargando tabla real ESPN...</div>';
 try{
  let liga=document.getElementById('liga').value;
  let data=await fetchESPN(`https://site.api.espn.com/apis/site/v2/sports/soccer/${liga}/standings`);
  let html='';
  (data.children||[]).forEach(g=>{
    html+=`<div class="bg-[#1e2735] rounded-xl overflow-hidden mb-3"><div class="p-2 bg-[#0f141e] text-[11px] font-black">${g.name}</div>
    ${(g.standings?.entries||[]).slice(0,20).map((e,i)=>`
      <div class="flex items-center gap-2 p-2.5 border-b border-gray-800/30 text-[11px]">
        <span class="w-4 text-gray-500">${i+1}</span>
        <img src="${e.team.logos?.[0]?.href}" class="w-5 h-5 bg-white rounded-full"/>
        <span class="flex-1 truncate">${e.team.displayName}</span>
        <span>${e.stats?.find(x=>x.name==='points')?.value||0} pts</span>
      </div>`).join('')}</div>`;
  });
  c.innerHTML=html||'<div class="p-4 text-[11px] text-gray-500">Tabla no disponible ahora. Liga en receso.</div>';
 }catch(e){ c.innerHTML=`Error tabla: ${e.message}`; }
}

function filter(){
 let q=document.getElementById('q').value.toLowerCase();
 render(all.filter(x=>x.search.includes(q)));
}

load();
</script>
</body>
</html>
