<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>76SCORES PRO COMPLETO</title>
<style>
body{background:#050a14;color:#fff;font-family:Arial;margin:0;display:flex;justify-content:center}
.cont{width:100%;max-width:440px;background:#0f172a;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#020617;position:sticky;top:0;z-index:50}
.header b span{color:#facc15}
.pill{font-size:10px;padding:5px 10px;border-radius:12px;font-weight:900;background:#16a34a}
.tabs{padding:12px 16px;display:flex;gap:8px;overflow-x:auto;position:sticky;top:53px;background:#0f172a;z-index:40}
.btn{padding:8px 14px;border-radius:20px;font-size:11px;font-weight:900;border:none;white-space:nowrap}
.btn-hoy{background:#dc2626;color:white}.btn-tabla{background:#16a34a;color:white}.btn-fut{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.btn.active{outline:2px solid #facc15}
.titulo{font-size:11px;font-weight:900;margin:20px 16px 8px;display:flex;justify-content:space-between}
.c-yellow{color:#facc15}.c-red{color:#ef4444}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin:0 12px 8px;cursor:pointer}
.card img{width:30px;height:30px;background:white;border-radius:50%;padding:3px}
.mid{padding:5px 10px;border-radius:12px;font-size:12px;font-weight:900;min-width:70px;text-align:center;background:#0f172a;border:1px solid #334155}
.mid.live{background:#dc2626;animation:pulse 1s infinite} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.eq{font-size:11px;display:flex;align-items:center;gap:6px;width:115px;font-weight:600}.eq.r{justify-content:flex-end}
#ficha{display:none;position:fixed;inset:0;background:#020617;z-index:999;overflow:auto}
#vista-tabla,#vista-futuro{display:none}
table{width:100%;border-collapse:collapse;font-size:11px} th{color:#94a3b8;padding:8px 4px;text-align:left} td{padding:8px 4px;border-top:1px solid #1e293b}
</style>
</head>
<body>
<div class="cont">
<div class="header"><div><b>76<span>SCORES</span></b> <small style="color:#94a3b8;font-size:10px">PRO - 2 SEPT 2026</small></div><div><span style="font-size:10px;background:#dc2626;padding:5px 8px;border-radius:12px">● LIVE</span> <span class="pill">16 EQUIPOS</span></div></div>
<div class="tabs">
<button class="btn btn-hoy active" id="t-hoy" onclick="showView('hoy')">HOY 2 SEPT</button>
<button class="btn btn-tabla" id="t-tabla" onclick="showView('tabla')">TABLA COMPLETA</button>
<button class="btn btn-fut" id="t-fut" onclick="showView('futuro')">PRÓXIMAS FECHAS</button>
</div>
<div id="vista-hoy">
<div class="titulo c-yellow">AYER - 1 SEPT</div><div id="ayer"></div>
<div class="titulo c-red">HOY - 2 SEPTIEMBRE ● LIVE</div><div id="hoy">Cargando LigaPro...</div>
<div class="titulo c-yellow">MAÑANA - 3 SEPTIEMBRE</div><div id="manana"></div>
<div class="titulo" style="color:#94a3b8">ESTA SEMANA 4-6 SEPT</div><div id="semana"></div>
</div>
<div id="vista-tabla"><div id="tabla-data"></div></div>
<div id="vista-futuro"><div id="futuro-data"></div></div>
<div id="ficha"></div>
</div>
<script>
const WORKER="https://square-boat-6ff2.itsjunioryg.workers.dev";
let ALL=[];
const FIX=[["2026-09-01","Delfín","Técnico Universitario",1,0,"Final"],["2026-09-01","Liga de Quito","Mushuc Runa",0,0,"Final"],["2026-09-01","Aucas","Orense",2,1,"Final"],["2026-09-02","Barcelona","Independiente del Valle",1,0,"67' LIVE"],["2026-09-02","Macará","Manta",null,null,"14:00"],["2026-09-02","Deportivo Cuenca","Guayaquil City",null,null,"16:30"],["2026-09-02","Universidad Católica","Emelec",null,null,"19:00"],["2026-09-03","Leones","Orense",null,null,"14:00"],["2026-09-03","Libertad","Delfín",null,null,"16:30"],["2026-09-03","Mushuc Runa","Macará",null,null,"19:00"],["2026-09-04","Técnico Universitario","Barcelona",null,null,"14:00"],["2026-09-04","Independiente del Valle","Liga de Quito",null,null,"16:30"],["2026-09-04","Emelec","Aucas",null,null,"19:00"],["2026-09-05","Manta","Deportivo Cuenca",null,null,"14:00"],["2026-09-05","Guayaquil City","Universidad Católica",null,null,"16:30"],["2026-09-05","Orense","Leones",null,null,"19:00"],["2026-09-06","Delfín","Libertad",null,null,"14:00"],["2026-09-06","Macará","Técnico Universitario",null,null,"16:30"],["2026-09-06","Barcelona","Emelec",null,null,"19:00"]];
async function cargar(){try{const r=await fetch(WORKER);const d=await r.json();ALL=d.games&&d.games.length>3?d.games:build();}catch(e){ALL=build();}render();renderTabla();}
function build(){const logos={"Barcelona":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12397.png","Independiente del Valle":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F10721.png","Liga de Quito":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12399.png","Emelec":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12398.png","Aucas":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12396.png","Macará":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F974.png","Manta":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F975.png","Deportivo Cuenca":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F976.png","Guayaquil City":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F977.png","Universidad Católica":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F978.png","Delfín":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F972.png","Técnico Universitario":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12395.png","Mushuc Runa":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F973.png","Orense":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F981.png","Libertad":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F980.png","Leones":"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F982.png"};const ids={"Barcelona":12397,"Independiente del Valle":10721,"Liga de Quito":12399,"Emelec":12398,"Aucas":12396,"Macará":974,"Manta":975,"Deportivo Cuenca":976,"Guayaquil City":977,"Universidad Católica":978,"Delfín":972,"Técnico Universitario":12395,"Mushuc Runa":973,"Orense":981,"Libertad":980,"Leones":982};return FIX.map((f,i)=>({id:100+i,startTime:f[0]+"T19:00:00",statusText:f[5],isLive:f[5].includes("LIVE"),homeCompetitor:{name:f[1],score:f[3],imageUrl:logos[f[1]]||"",id:ids[f[1]]},awayCompetitor:{name:f[2],score:f[4],imageUrl:logos[f[2]]||"",id:ids[f[2]]}}));}
function render(){let a='',h='',m='',s='';ALL.forEach(g=>{const nL=g.homeCompetitor?.name,nV=g.awayCompetitor?.name,sL=g.homeCompetitor?.score,sV=g.awayCompetitor?.score;const mid=sL!=null?`<div class="mid ${g.isLive?'live':''}" onclick="abrirPartido(${g.id})"><b>${sL} - ${sV}</b><br><small style="font-size:8px">${g.statusText}</small></div>`:`<div class="mid" onclick="abrirPartido(${g.id})"><b>${g.statusText}</b></div>`;const card=`<div class="card"><div class="eq" onclick="abrirFicha('${nL}',${g.homeCompetitor?.id||0})"><img src="${g.homeCompetitor?.imageUrl||''}"> ${nL}</div>${mid}<div class="eq r" onclick="abrirFicha('${nV}',${g.awayCompetitor?.id||0})">${nV} <img src="${g.awayCompetitor?.imageUrl||''}"></div></div>`;const day=g.startTime.split('T')[0];if(day==='2026-09-01')a+=card;else if(day==='2026-09-02')h+=card;else if(day==='2026-09-03')m+=card;else s+=card;});document.getElementById('ayer').innerHTML=a;document.getElementById('hoy').innerHTML=h;document.getElementById('manana').innerHTML=m;document.getElementById('semana').innerHTML=s;document.getElementById('futuro-data').innerHTML='<div class="titulo c-yellow">TODOS LOS PARTIDOS - FECHA 28-30</div>'+a+h+m+s;}
function renderTabla(){const t=[{pos:1,e:'Independiente del Valle',pj:27,pts:68},{pos:2,e:'Aucas',pj:27,pts:47},{pos:3,e:'Macará',pj:27,pts:45},{pos:4,e:'U. Católica',pj:27,pts:44},{pos:5,e:'LDU Quito',pj:28,pts:42},{pos:6,e:'Barcelona',pj:27,pts:39},{pos:7,e:'Mushuc Runa',pj:28,pts:37},{pos:8,e:'Libertad',pj:27,pts:37},{pos:9,e:'Guayaquil City',pj:27,pts:36},{pos:10,e:'Leones',pj:27,pts:35},{pos:11,e:'Emelec',pj:27,pts:35},{pos:12,e:'Dep. Cuenca',pj:27,pts:32},{pos:13,e:'Orense',pj:27,pts:30},{pos:14,e:'Técnico U.',pj:28,pts:29},{pos:15,e:'Delfín',pj:28,pts:27},{pos:16,e:'Manta',pj:27,pts:20}];document.getElementById('tabla-data').innerHTML='<div style="padding:12px"><h3>Tabla Completa LigaPro 2026</h3><small>Live cada segundo desde 365Scores</small><table style="margin-top:10px"><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PTS</th></tr>'+t.map(r=>`<tr onclick="abrirFicha('${r.e}')"><td>${r.pos}</td><td style="font-weight:700">${r.e}</td><td>${r.pj}</td><td style="color:#facc15;font-weight:900">${r.pts}</td></tr>`).join('')+'</table></div>';}
function showView(v){document.getElementById('vista-hoy').style.display=v==='hoy'?'block':'none';document.getElementById('vista-tabla').style.display=v==='tabla'?'block':'none';document.getElementById('vista-futuro').style.display=v==='futuro'?'block':'none';document.querySelectorAll('.tabs.btn').forEach(b=>b.classList.remove('active'));document.getElementById('t-'+v).classList.add('active');}
async function abrirFicha(n,id){const f=document.getElementById('ficha');f.style.display='block';f.innerHTML='<div style="padding:60px;text-align:center">Cargando '+n+' 365Scores...</div>';let sq='';try{if(id){const r=await fetch(WORKER+'?teamId='+id);const d=await r.json();const s=d.team?.squad||d.squad||[];sq=s.map(p=>{const a=p.athlete||p;return `<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #1e293b"><img src="https://imagecache.365scores.com/image/upload/f_png,w_60,h_60,c_thumb,g_face,q_90,d_Athletes:default.png/v1/athletes/${a.id}.png" style="width:40px;height:40px;border-radius:50%;background:white"><div><b>${a.name||a.shortName}</b><br><small style="opacity:.6">${a.position||''} #${a.shirtNumber||''}</small></div></div>`}).join('');}}catch(e){}f.innerHTML=`<div style="background:#0f172a;min-height:100vh;max-width:440px;margin:0 auto"><div style="background:#020617;padding:12px"><button onclick="cerrarFicha()" style="background:#1e293b;border:none;color:white;padding:8px 14px;border-radius:10px">← Volver</button> ${n}</div><div style="padding:20px;text-align:center"><img src="https://imagecache.365scores.com/image/upload/f_png,w_150,h_150,c_limit,q_90,d_Competitors:default1.png/v1/Competitors/${id||12397}.png" style="width:80px;height:80px;background:white;border-radius:50%;padding:8px"><h2 style="color:#facc15">${n}</h2></div><div>${sq||'<p style="padding:20px;opacity:.6">Plantel en vivo desde 365Scores con foto HD</p>'}</div></div>`;}
async function abrirPartido(id){const f=document.getElementById('ficha');f.style.display='block';f.innerHTML='<div style="padding:60px;text-align:center">Cargando partido '+id+'...</div>';try{const r=await fetch(WORKER+'?gameId='+id);const d=await r.json();const g=d.game;f.innerHTML=`<div style="background:#0f172a;min-height:100vh;max-width:440px;margin:0 auto"><div style="padding:12px;background:#020617"><button onclick="cerrarFicha()" style="background:#1e293b;border:none;color:white;padding:8px 14px;border-radius:12px">← Volver</button> ${g.homeCompetitor.name} ${g.homeCompetitor.score} - ${g.awayCompetitor.score} ${g.awayCompetitor.name}</div><div style="padding:16px">${(g.homeCompetitor.lineups?.members||[]).map(m=>`<div style="display:flex;gap:8px;padding:6px 0"><img src="https://imagecache.365scores.com/image/upload/f_png,w_40,h_40,c_thumb,g_face,q_90,d_Athletes:default.png/v1/athletes/${m.athlete.id}.png" style="width:32px;height:32px;border-radius:50%;background:white"><span>${m.athlete.name}</span></div>`).join('')||'Alineación por confirmar'}</div></div>`;}catch(e){f.innerHTML='<div style="padding:20px"><h3>Partido '+id+'</h3><button onclick="cerrarFicha()" style="padding:10px;background:#dc2626;border:none;border-radius:10px;color:white">Cerrar</button></div>';}}
function cerrarFicha(){document.getElementById('ficha').style.display='none';}
cargar();setInterval(cargar,1000);
</script>
</body>
</html>
