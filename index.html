<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>76Scores - LigaPro</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;margin:0}
header{background:#020617;padding:15px;text-align:center;border-bottom:2px solid #facc15}
.tabs{display:flex;gap:10px;padding:10px;justify-content:center}
.tab{padding:8px 16px;background:#1e293b;border-radius:20px;cursor:pointer}
.tab.active{background:#facc15;color:black}
.match{background:#1e293b;margin:10px;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.match img{width:28px;height:28px}
#ficha{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:99;display:none;overflow:auto;padding:20px}
</style>
</head>
<body>
<header><h2>76Scores - 100% LigaPro</h2></header>
<div class="tabs">
<div class="tab active" onclick="filtrar('all',this)">TODOS</div>
<div class="tab" onclick="filtrar('live',this)">EN VIVO</div>
<div class="tab" onclick="filtrar('finished',this)">FINALIZADOS</div>
</div>
<div id="lista">Cargando LigaPro...</div>
<div id="ficha"></div>

<script>
const WORKER = "https://square-boat-6ff2.itsjunioryg.workers.dev";
let TODOS = [];

async function cargar(){
  const res = await fetch(WORKER);
  const data = await res.json();
  TODOS = data.games || data;
  pintar(TODOS);
}
function pintar(juegos){
  const div = document.getElementById('lista');
  div.innerHTML = juegos.map(g=>{
    const local = g.homeCompetitor?.name || g.homeTeam?.name || 'Local';
    const visita = g.awayCompetitor?.name || g.awayTeam?.name || 'Visita';
    const golL = g.homeCompetitor?.score ?? '-';
    const golV = g.awayCompetitor?.score ?? '-';
    const minuto = g.statusText || g.gameTimeDisplay || 'vs';
    return `<div class="match" onclick="abrir(${g.id})">
      <span><img src="${g.homeCompetitor?.imageUrl || ''}"> ${local}</span>
      <b>${golL} - ${golV} <small style="color:#facc15">${minuto}</small></b>
      <span>${visita} <img src="${g.awayCompetitor?.imageUrl || ''}"></span>
    </div>`;
  }).join('');
}
async function abrir(id){
  const res = await fetch(`${WORKER}?gameId=${id}`);
  const d = await res.json();
  const game = d.game;
  document.getElementById('ficha').innerHTML = `
    <button onclick="this.parentElement.style.display='none'" style="background:red;color:white;padding:10px;border-radius:8px">Cerrar X</button>
    <h2>${game.homeCompetitor.name} ${game.homeCompetitor.score} - ${game.awayCompetitor.score} ${game.awayCompetitor.name}</h2>
    <p>Estadio: ${game.stadium?.name || 'LigaPro'} | ${game.statusText}</p>
    <h3>Alineaciones</h3>
    <p>${(game.homeCompetitor.lineups?.members || []).map(m=>m.athlete.name).join(', ')}</p>
    <p>vs</p>
    <p>${(game.awayCompetitor.lineups?.members || []).map(m=>m.athlete.name).join(', ')}</p>
  `;
  document.getElementById('ficha').style.display='block';
}
function filtrar(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); el.classList.add('active');
  if(t==='all') pintar(TODOS);
  if(t==='live') pintar(TODOS.filter(g=>g.statusText?.includes("'") || g.isLive));
  if(t==='finished') pintar(TODOS.filter(g=>g.statusText?.toLowerCase().includes('fin')));
}
cargar();
</script>
</body>
</html>
