<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>76Scores</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, sans-serif;}
body{background:#0f1419;color:white;padding-bottom:80px;}
.header{background:#1a222c;padding:15px;text-align:center;font-weight:bold;font-size:18px;position:sticky;top:0;z-index:10}
.league-list{padding:10px}
.league-item{background:#1e2a36;padding:15px;margin:8px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.league-item:active{transform:scale(0.98)}
.tabs{display:flex;background:#1a222c;padding:5px;gap:5px;position:sticky;top:52px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;background:#253141;cursor:pointer;font-size:14px}
.tab.active{background:#2e8bff;color:white}
.match-card{background:#1e2a36;margin:8px;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.team{display:flex;align-items:center;gap:8px;width:40%}
.team.right{justify-content:flex-end}
.score{background:#0f1419;padding:6px 12px;border-radius:6px;font-weight:bold;min-width:60px;text-align:center}
.table{width:100%;border-collapse:collapse;margin-top:10px}
.table th{padding:10px;font-size:12px;color:#8a9bb0;text-align:left;background:#1a222c;position:sticky;top:95px}
.table td{padding:12px 10px;border-bottom:1px solid #1e2a36;font-size:14px}
.table tr.top4{border-left:3px solid #2e8bff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1a222c;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #253141;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#8a9bb0;cursor:pointer;gap:3px}
.nav-item.active{color:#2e8bff}
.nav-item span{font-size:20px}
.hidden{display:none}
.live{color:#ff3b30;font-size:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header" id="headerTitle">76Scores</div>
<div id="view-favoritos" class="view hidden"><div style="padding:20px;text-align:center;color:#8a9bb0;margin-top:50px">⭐ Tus partidos favoritos aparecerán aquí</div></div>
<div id="view-ligas" class="view"><div class="league-list" id="leagueList"></div></div>
<div id="view-partidos-liga" class="view hidden">
<div class="tabs"><div class="tab active" onclick="switchTab('partidos')">Partidos</div><div class="tab" onclick="switchTab('tabla')">Tabla</div></div>
<div id="matchesContainer"></div>
<div id="tableContainer" class="hidden" style="padding:10px"><table class="table" id="posTable"></table></div>
</div>
<div id="view-noticias" class="view hidden"><div style="padding:20px;text-align:center;color:#8a9bb0;margin-top:50px">📰 Noticias próximamente</div></div>
<div id="view-config" class="view hidden"><div style="padding:20px"><h3>Configuración</h3><br><p style="color:#8a9bb0">⚙️ Tema oscuro activo</p></div></div>
<div class="bottom-nav">
<div class="nav-item" onclick="showView('favoritos')"><span>⭐</span>Favoritos</div>
<div class="nav-item active" onclick="showView('ligas')"><span>🏆</span>Ligas</div>
<div class="nav-item" onclick="showView('noticias')"><span>📰</span>Noticias</div>
<div class="nav-item" onclick="showView('config')"><span>⚙️</span>Config</div>
</div>
<script>
const ligas = [
{id:'PL',name:'Premier League',flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿'},
{id:'LL',name:'La Liga',flag:'🇪🇸'},
{id:'SA',name:'Serie A',flag:'🇮🇹'},
{id:'BL',name:'Bundesliga',flag:'🇩🇪'},
{id:'L1',name:'Ligue 1',flag:'🇫🇷'},
{id:'EC',name:'LigaPro Ecuador',flag:'🇪🇨'}
];
const partidosPL = [
{local:'Man City',visitante:'Arsenal',hora:'14:30',live:true,score:'2-1'},
{local:'Liverpool',visitante:'Chelsea',hora:'12:00',score:'0-0'},
{local:'Man United',visitante:'Tottenham',hora:'14:45',score:'1-1'},
{local:'Newcastle',visitante:'Aston Villa',hora:'09:00',score:'3-0'},
{local:'Brighton',visitante:'West Ham',hora:'09:00',score:'1-2'},
{local:'Everton',visitante:'Fulham',hora:'11:30',score:'2-2'},
{local:'Brentford',visitante:'Crystal Palace',hora:'14:30',score:'0-1'},
{local:'Wolves',visitante:'Burnley',hora:'09:00',score:'1-0'}
];
const tablaPL = [
{pos:1,equipo:'Man City',pj:28,pts:65},
{pos:2,equipo:'Arsenal',pj:28,pts:62},
{pos:3,equipo:'Liverpool',pj:28,pts:60},
{pos:4,equipo:'Aston Villa',pj:28,pts:55},
{pos:5,equipo:'Tottenham',pj:28,pts:50},
{pos:6,equipo:'Man United',pj:28,pts:48},
{pos:7,equipo:'Newcastle',pj:28,pts:44},
{pos:8,equipo:'Brighton',pj:28,pts:42},
{pos:9,equipo:'Chelsea',pj:28,pts:39},
{pos:10,equipo:'West Ham',pj:28,pts:38}
];
let ligaActual = '';
function showView(v){
document.querySelectorAll('.view').forEach(e=>e.classList.add('hidden'));
document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
document.getElementById('view-'+v).classList.remove('hidden');
if(v==='ligas') renderLigas();
event?.currentTarget?.classList?.add('active');
if(v==='ligas') document.querySelectorAll('.nav-item')[1].classList.add('active');
document.getElementById('headerTitle').innerText = v==='ligas'? '76Scores - Ligas' : v.charAt(0).toUpperCase()+v.slice(1);
}
function renderLigas(){
const c = document.getElementById('leagueList');
c.innerHTML = ligas.map(l=>`<div class="league-item" onclick="abrirLiga('${l.id}','${l.name}')"><div>${l.flag} ${l.name}</div><div>›</div></div>`).join('');
}
function abrirLiga(id,nombre){
ligaActual=id;
document.querySelectorAll('.view').forEach(e=>e.classList.add('hidden'));
document.getElementById('view-partidos-liga').classList.remove('hidden');
document.getElementById('headerTitle').innerText = nombre;
renderPartidos();
renderTabla();
switchTab('partidos');
}
function renderPartidos(){
const c = document.getElementById('matchesContainer');
let partidos = ligaActual==='PL'? partidosPL : [{local:'Equipo A',visitante:'Equipo B',hora:'15:00',score:'0-0'}];
c.innerHTML = partidos.map(p=>`<div class="match-card"><div class="team">${p.local}</div><div class="score">${p.live?'<div class=live>EN VIVO</div>':''}${p.score}<div style="font-size:10px;color:#8a9bb0">${p.hora}</div></div><div class="team right">${p.visitante}</div></div>`).join('');
}
function renderTabla(){
const t = document.getElementById('posTable');
t.innerHTML = `<tr><th>#</th><th>Equipo</th><th>PJ</th><th>Pts</th></tr>` + tablaPL.map(e=>`<tr class="${e.pos<=4?'top4':''}"><td>${e.pos}</td><td>${e.equipo}</td><td>${e.pj}</td><td><b>${e.pts}</b></td></tr>`).join('');
}
function switchTab(tab){
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
if(tab==='partidos'){
document.querySelectorAll('.tab')[0].classList.add('active');
document.getElementById('matchesContainer').classList.remove('hidden');
document.getElementById('tableContainer').classList.add('hidden');
}else{
document.querySelectorAll('.tab')[1].classList.add('active');
document.getElementById('matchesContainer').classList.add('hidden');
document.getElementById('tableContainer').classList.remove('hidden');
}
}
renderLigas();
</script>
</body>
</html>
