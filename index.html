<!-- REEMPLAZA SOLO LAS FUNCIONES abrirFicha y abrirPartido por estas NUEVAS -->

<script>
  async function abrirFicha(nombreEquipo) {
    const t = TEAMS_INFO[nombreEquipo];
    const ficha = document.getElementById('ficha');
    // Pantalla de carga tipo 365
    ficha.innerHTML = `<div style="background:#1e293b;min-height:100vh;padding:0;max-width:420px;margin:0 auto">
      <div style="padding:20px;text-align:center"><div style="width:30px;height:30px;border:3px solid #facc15;border-top-color:transparent;border-radius:50%;margin:40px auto;animation:spin 1s linear infinite"></div><p style="font-size:12px">Cargando datos de ${nombreEquipo} desde 365Scores...</p></div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
    ficha.style.display = 'block';
  
    // Busca ID real de 365 para ese equipo
    let teamId = null;
    const game = (ALL_GAMES||[]).find(g=> g.homeCompetitor?.name.toLowerCase().includes(nombreEquipo.toLowerCase()) || g.awayCompetitor?.name.toLowerCase().includes(nombreEquipo.toLowerCase()));
    if(game){
      if(game.homeCompetitor?.name.toLowerCase().includes(nombreEquipo.toLowerCase())) teamId = game.homeCompetitor.id;
      else teamId = game.awayCompetitor.id;
    }
  
    let plantelHTML = '';
    try{
      if(teamId){
        const r = await fetch(`${WORKER}?teamId=${teamId}`);
        const data = await r.json();
        const squad = data.team?.squad || data.squad || [];
        plantelHTML = squad.map(p=>{
          const at = p.athlete || p;
          return `<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #0f172a">
            <img src="https://imagecache.365scores.com/image/upload/f_png,w_80,h_80,c_thumb,g_face,q_90,d_Athletes:default.png/v1/athletes/${at.id}.png" style="width:42px;height:42px;border-radius:50%;background:white" onerror="this.src='https://via.placeholder.com/42'">
            <div style="flex:1"><b style="font-size:13px">${at.name||at.shortName}</b><br><small style="opacity:.7">${at.position||p.position||''} - ${at.age?at.age+' años':''}</small></div>
            <span style="font-size:11px;background:#0f172a;padding:4px 8px;border-radius:8px">${at.shirtNumber||''}</span>
          </div>`;
        }).join('');
      }
    }catch(e){}
  
    if(!plantelHTML) plantelHTML = (t?.jugadores||[]).map(j=>`<div style="padding:10px;border-bottom:1px solid #0f172a">${j}</div>`).join('');
  
    ficha.innerHTML = `
    <div style="background:#0f172a;min-height:100vh;max-width:420px;margin:0 auto;border-left:1px solid #1e293b;border-right:1px solid #1e293b">
      <div style="background:#020617;padding:12px;display:flex;align-items:center;gap:10px;position:sticky;top:0"><button onclick="cerrarFicha()" style="background:#1e293b;border:none;color:white;padding:8px 12px;border-radius:10px">← Volver</button><b>${t?.nombre||nombreEquipo}</b></div>
      <div style="padding:20px;text-align:center;border-bottom:1px solid #1e293b">
        <img src="https://imagecache.365scores.com/image/upload/f_png,w_120,h_120,c_limit,q_90,d_Competitors:default1.png/v1/Competitors/${teamId||12397}.png" style="width:80px;height:80px;background:white;border-radius:50%;padding:8px">
        <h2 style="margin:10px 0 4px;color:${t?.color||'#facc15'}">${t?.nombre||nombreEquipo}</h2>
        <small style="opacity:.7">${t?.ciudad||''} - ${t?.estadio||''}</small>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;text-align:left">
          <div style="background:#1e293b;padding:10px;border-radius:12px"><small style="opacity:.6">ESTADIO</small><br><b style="font-size:11px">${t?.estadio||'Monumental'}</b><br><small>${t?.aforo||''}</small></div>
          <div style="background:#1e293b;padding:10px;border-radius:12px"><small style="opacity:.6">DT</small><br><b style="font-size:11px">${t?.dt||'Por confirmar'}</b></div>
          <div style="background:#1e293b;padding:10px;border-radius:12px"><small style="opacity:.6">TÍTULOS</small><br><b style="font-size:14px;color:#facc15">${t?.titulos||'0'}</b></div>
        </div>
      </div>
      <div style="padding:0">
        <div style="padding:14px 16px;display:flex;gap:8px"><span style="background:#facc15;color:black;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800">PLANTEL</span><span style="background:#1e293b;padding:5px 12px;border-radius:20px;font-size:11px">ESTADÍSTICAS</span></div>
        ${plantelHTML}
      </div>
    </div>`;
  }
  
  async function abrirPartido(id){
    // ... (usa la función anterior que ya tienes, esa ya trae alineaciones con fotos)
    const r = await fetch(WORKER+`?gameId=${id}`); 
    const d = await r.json(); 
    const g = d.game;
    // Si falla, muestra fallback
    if(!g) { alert('Cargando en vivo...'); return; }
    // tu código anterior de abrirPartido con fotos HD sigue igual
    document.getElementById('ficha').innerHTML = `<div style="background:#1e293b;padding:20px;border-radius:16px;max-width:400px;margin:auto"><h2>${g.homeCompetitor.name} ${g.homeCompetitor.score} - ${g.awayCompetitor.score} ${g.awayCompetitor.name}</h2><p>${g.statusText}</p><button onclick="cerrarFicha()" style="width:100%;padding:12px;background:#dc2626;border:none;border-radius:12px;color:white">Cerrar</button></div>`;
    document.getElementById('ficha').style.display='block';
  }
  </script>
